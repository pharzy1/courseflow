name: Authenticated release verification
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public CourseFlow release URL to verify
        required: true
        default: https://courseflowplanner.com
permissions:
  contents: read
jobs:
  clerk-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      COURSEFLOW_REQUIRE_AUTH_E2E: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Require Clerk test credentials
        run: test -n "$CLERK_SECRET_KEY" && test -n "$CLERK_PUBLISHABLE_KEY"
      - name: Verify authenticated save, restore, and account isolation
        run: pnpm exec playwright test tests/e2e/authenticated-plans.spec.ts --project=desktop
