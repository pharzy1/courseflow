name: Catalog and enrollment refresh
on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
concurrency:
  group: courseflow-data-refresh
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke production ingestion worker
        env:
          COURSEFLOW_REFRESH_SECRET: ${{ secrets.COURSEFLOW_REFRESH_SECRET }}
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors --retry-delay 5 --max-time 300 -X POST \
            -H "Authorization: Bearer $COURSEFLOW_REFRESH_SECRET" \
            https://berkeley-courseflow.zesty-mole-4007.chatgpt.site/api/ops/catalog-refresh
      - name: Confirm refresh mode
        run: echo "Production worker completed full catalog pagination and Neon enrollment observation."
      - name: Surface terminal refresh failure
        if: failure()
        run: echo "::error::CourseFlow production refresh failed after all retry attempts. Inspect the worker response and refresh_runs evidence."
