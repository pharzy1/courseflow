name: Catalog snapshot refresh
on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COURSEFLOW_SYNC_MAX_PAGES: 100
      - run: pnpm test:integration
      - name: Confirm refresh mode
        run: echo "Full source pagination completed; Neon upserts run when the DATABASE_URL repository secret is configured."
