name: Catalog and enrollment refresh
on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
concurrency:
  group: courseflow-data-refresh
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke production ingestion worker
        env:
          COURSEFLOW_REFRESH_SECRET: ${{ secrets.COURSEFLOW_REFRESH_SECRET }}
        run: curl --fail-with-body --retry 2 --max-time 300 -X POST -H "Authorization: Bearer $COURSEFLOW_REFRESH_SECRET" https://berkeley-courseflow.zesty-mole-4007.chatgpt.site/api/ops/catalog-refresh
      - name: Confirm refresh mode
        run: echo "Production worker completed full catalog pagination and Neon enrollment observation."
