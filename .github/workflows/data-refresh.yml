name: Catalog and enrollment refresh
on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
concurrency:
  group: courseflow-data-refresh
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COURSEFLOW_SYNC_MAX_PAGES: 100
          COURSEFLOW_SYNC_PAGE_SIZE: 500
          COURSEFLOW_SYNC_TIMEOUT_MS: 20000
      - run: pnpm test:integration
      - name: Confirm refresh mode
        run: echo "Full catalog pagination and enrollment observation completed in Neon."
